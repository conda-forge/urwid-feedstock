schema_version: 1

context:
  version: "5.1.0"

package:
  name: urwid
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/u/urwid/urwid-${{ version }}.tar.gz
  sha256: 36c8aa321fe5ac0c47dccc913bfbbd504d96caad8644c5a7ada0ec8c522fb808

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=80.8.0
    - setuptools-scm >=8.1.0
    - pip
  run:
    - python >=${{ python_min }}
    - wcwidth !=0.9.0,!=0.9.1,>=0.4
    - typing_extensions >=4.5.0
tests:
  - python:
      imports:
        - urwid
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - '*'

about:
  summary: A full-featured console (xterm et al.) user interface library
  license: LGPL-2.1-only
  license_file: COPYING
  homepage: https://urwid.org/
  documentation: https://urwid.org/manual/index.html

extra:
  recipe-maintainers:
    - asmeurer
    - matthiasdiener
    - ocefpaf
    - scopatz
