schema_version: 1

context:
  version: "4.1.2"

package:
  name: urwid
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/u/urwid/urwid-${{ version }}.tar.gz
  sha256: 40bf34e07d05b82fb306082925c404f8f738fd76e0af54801005d7f3a69ad18a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=80.8.0
    - setuptools-scm >=8.1.0
    - pip
  run:
    - python >=${{ python_min }}
    - wcwidth >=0.4
    - typing_extensions

tests:
  - python:
      imports:
        - urwid
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: A full-featured console (xterm et al.) user interface library
  license: LGPL-2.1-only
  license_file: COPYING
  homepage: https://urwid.org/
  documentation: https://urwid.org/manual/index.html

extra:
  recipe-maintainers:
    - asmeurer
    - matthiasdiener
    - ocefpaf
    - scopatz
